services:
  - type: web
    name: oxalpha-api
    runtime: python
    plan: free
    repo: https://github.com/Client13/OxAlpha
    branch: main
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python3 oxalpha_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PROXY_API_KEY
        sync: generate          # random key generated by Render; rotate in dashboard
      - key: OXA_MIN_INTERVAL
        value: "2.0"
      - key: SOLVER_MODE
        value: "off"            # datacenter IP + no chromium: challenges -> HTTP 429
      - key: PROXY_POOL
        value: "1"              # route upstream through the committed seed pool
      - key: PROXY_POOL_FILE
        value: "proxies_seed.json"
